<script>
  (() => {
    const P = "modulex-acilis-sahne-gecis";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sahneGecis = (s, P, az) => {
        const kare = Array.from(s.querySelectorAll("[data-kare]"));
        const dug = Array.from(s.querySelectorAll("[data-sahne]"));
        if (kare.length < 2 || dug.length !== kare.length) return;
        s.classList.add(P + "--gjs");
        const no = s.querySelector("[data-no]");
        const alt = s.querySelector("[data-altyazi]");
        const altM = s.querySelector("[data-altmetin]");
        const oto = s.querySelector("[data-oto]");
        let f;
        try { f = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (x) { f = { format: String }; }
        let i = 0;
        let t = 0;
        let dur = az || !oto;
        let bekle = false;
        const kur = () => {
          clearTimeout(t);
          s.classList.remove(P + "--kos");
          if (!oto || dur || bekle) return;
          const sn = Math.max(3, Number(oto.dataset.oto) || 7);
          s.style.setProperty("--sure", sn + "s");
          void s.offsetWidth;
          s.classList.add(P + "--kos");
          t = setTimeout(() => git(i + 1), sn * 1000);
        };
        const git = (n, odak) => {
          i = (n + kare.length) % kare.length;
          kare.forEach((k, j) => {
            k.classList.toggle(P + "-kare--aktif", j === i);
            if (j === i) k.removeAttribute("aria-hidden"); else k.setAttribute("aria-hidden", "true");
          });
          dug.forEach((b, j) => { if (j === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
          if (no) no.textContent = f.format(i + 1);
          if (altM) {
            const e = dug[i].dataset.etiket || "";
            altM.textContent = e;
            if (alt) alt.hidden = !e;
          }
          if (odak) dug[i].focus();
          kur();
        };
        dug.forEach((b, j) => {
          b.addEventListener("click", () => git(j));
          b.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = e.key === (rtl ? "ArrowLeft" : "ArrowRight");
            const geri = e.key === (rtl ? "ArrowRight" : "ArrowLeft");
            if (ileri || geri) { e.preventDefault(); git(i + (ileri ? 1 : -1), true); }
            else if (e.key === "Home") { e.preventDefault(); git(0, true); }
            else if (e.key === "End") { e.preventDefault(); git(kare.length - 1, true); }
          });
        });
        if (oto) {
          if (az) oto.hidden = true;
          const yaz = () => {
            oto.setAttribute("aria-label", dur ? oto.dataset.oynat : oto.dataset.durdur);
            oto.setAttribute("aria-pressed", String(dur));
            const ik = oto.querySelector("span");
            if (ik) ik.textContent = dur ? "play_arrow" : "pause";
          };
          oto.addEventListener("click", () => { dur = !dur; yaz(); kur(); });
          s.addEventListener("pointerenter", () => { bekle = true; kur(); });
          s.addEventListener("pointerleave", () => { bekle = false; kur(); });
          s.addEventListener("focusin", () => { bekle = true; kur(); });
          s.addEventListener("focusout", (e) => { if (!s.contains(e.relatedTarget)) { bekle = false; kur(); } });
          yaz();
        }
        git(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sahneGecis(s, P, az);
    });
  })();
</script>
