  .modulex-cagri-rezervasyon-cubugu-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-cagri-rezervasyon-cubugu-bas2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 48px; align-items: end; margin-block-end: clamp(24px, 4vw, 40px); }

  .modulex-cagri-rezervasyon-cubugu-cubuk { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: clamp(14px, 2vw, 20px); border: 1px solid --cizgi--; border-radius: calc(--yuvarlak-- + 4px); background: --kartBg--; box-shadow: 0 30px 60px -38px color-mix(in srgb, --yaziRenk-- 75%, transparent); }
  .modulex-cagri-rezervasyon-cubugu-sahne--gorsel .modulex-cagri-rezervasyon-cubugu-cubuk { margin-block-start: clamp(-64px, -6vw, -36px); margin-inline: clamp(12px, 5vw, 64px); }
  .modulex-cagri-rezervasyon-cubugu-alan { flex: 1 1 160px; display: grid; gap: 6px; min-width: 0; }
  .modulex-cagri-rezervasyon-cubugu-etiket { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-cagri-rezervasyon-cubugu-girdi { inline-size: 100%; min-height: 50px; padding: 10px 14px; border: 1px solid --cizgi--; border-radius: 12px; background: --bg--; color: --yaziRenk--; font: inherit; font-variant-numeric: tabular-nums; transition: border-color 0.2s ease; }
  .modulex-cagri-rezervasyon-cubugu-girdi:focus { border-color: --accent--; outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, --accent-- 25%, transparent); }
  .modulex-cagri-rezervasyon-cubugu-kisi { max-inline-size: 140px; }
  .modulex-cagri-rezervasyon-cubugu-alan:has(.modulex-cagri-rezervasyon-cubugu-kisi) { flex: 0 1 140px; }
  .modulex-cagri-rezervasyon-cubugu-gonder { flex: 0 0 auto; min-height: 50px; border-radius: 12px; }
  .modulex-cagri-rezervasyon-cubugu-alt { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 24px; margin-block-start: 20px; }
  .modulex-cagri-rezervasyon-cubugu-gece { display: flex; align-items: center; gap: 6px; color: --yaziRenk--; }
  .modulex-cagri-rezervasyon-cubugu-geikon { color: --accentInk--; font-size: 20px; }
  .modulex-cagri-rezervasyon-cubugu-wa { display: inline-flex; align-items: center; gap: 8px; color: --yaziRenk--; font-weight: 700; text-decoration: none; transition: color 0.25s ease; }
  .modulex-cagri-rezervasyon-cubugu-wa:hover { color: --accentInk--; }
  .modulex-cagri-rezervasyon-cubugu-ikinci { color: --yaziRenk--; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  @keyframes modulex-cagri-rezervasyon-cubugu-yak { from { transform: scale(1); } to { transform: scale(1.06); } }
  @media (max-width: 768px) {
    .modulex-cagri-rezervasyon-cubugu-bas2 { grid-template-columns: minmax(0, 1fr); }
    .modulex-cagri-rezervasyon-cubugu-foto { aspect-ratio: 4 / 3; }
    .modulex-cagri-rezervasyon-cubugu-sahne--gorsel .modulex-cagri-rezervasyon-cubugu-cubuk { margin-block-start: -28px; margin-inline: 8px; }
    .modulex-cagri-rezervasyon-cubugu-gonder { flex: 1 1 100%; justify-content: center; }
    .modulex-cagri-rezervasyon-cubugu-alan:has(.modulex-cagri-rezervasyon-cubugu-kisi), .modulex-cagri-rezervasyon-cubugu-kisi { flex: 1 1 100%; max-inline-size: none; }
  }
  .modulex-cagri-rezervasyon-cubugu-wasvg { width: 1.25em; height: 1.25em; flex: none; }
  .modulex-cagri-rezervasyon-cubugu-maddeler { display: grid; gap: 12px; }
  .modulex-cagri-rezervasyon-cubugu-madde { display: flex; align-items: flex-start; gap: 12px; }
  .modulex-cagri-rezervasyon-cubugu-mikon { flex: none; color: --accentInk--; font-size: 24px; }
  .modulex-cagri-rezervasyon-cubugu-myazi { display: grid; gap: 2px; }
  .modulex-cagri-rezervasyon-cubugu-myazi strong { font-weight: 700; }
  .modulex-cagri-rezervasyon-cubugu-myazi small { color: --muted--; font-size: 0.92rem; }
  .modulex-cagri-rezervasyon-cubugu-not { color: --muted--; font-size: 0.9rem; }
  .modulex-cagri-rezervasyon-cubugu-saat { display: flex; align-items: center; gap: 8px; color: --muted--; font-size: 0.95rem; }
  .modulex-cagri-rezervasyon-cubugu-saat .material-symbols-outlined { font-size: 20px; color: --accentInk--; }
  .modulex-cagri-rezervasyon-cubugu-metin { max-width: 62ch; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-rezervasyon-cubugu :is(.modulex-cagri-rezervasyon-cubugu-baslik, .modulex-cagri-rezervasyon-cubugu-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-cagri-rezervasyon-cubugu-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-cagri-rezervasyon-cubugu { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-cagri-rezervasyon-cubugu *, .modulex-cagri-rezervasyon-cubugu *::before, .modulex-cagri-rezervasyon-cubugu *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-cagri-rezervasyon-cubugu";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const rzTarih = (s) => {
        const f = s.querySelector("form[data-rz]");
        if (!f) return;
        const g = f.querySelector("[data-rz-giris]");
        const c = f.querySelector("[data-rz-cikis]");
        const gece = s.querySelector("[data-rz-gece]");
        const dl = document.documentElement.lang || undefined;
        const iso = (t) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
        const coz = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
        let nf = null;
        let tf = null;
        try { nf = new Intl.NumberFormat(dl); tf = new Intl.DateTimeFormat(dl, { day: "numeric", month: "long", year: "numeric" }); } catch (x) { nf = null; tf = null; }
        const bugun = new Date();
        bugun.setHours(0, 0, 0, 0);
        if (g) g.min = iso(bugun);
        const etiket = (e) => { const l = e.id ? f.querySelector(`label[for="${e.id}"]`) : null; return l ? l.textContent.trim() : e.name; };
        const deger = (e) => { const v = String(e.value).trim(); const t = e.type === "date" ? coz(v) : null; return t && tf ? tf.format(t) : v; };
        const esle = () => {
          const a = g ? coz(g.value) : null;
          if (c) {
            const ert = new Date(a || bugun);
            ert.setDate(ert.getDate() + 1);
            c.min = iso(ert);
            const b0 = coz(c.value);
            if (a && (!b0 || b0 < ert)) c.value = iso(ert);
          }
          const b = c ? coz(c.value) : null;
          const n = a && b ? Math.round((b - a) / 86400000) : 0;
          if (gece) {
            gece.hidden = n < 1;
            const say = gece.querySelector("[data-rz-sayi]");
            if (say) say.textContent = n > 0 ? (nf ? nf.format(n) : String(n)) : "";
          }
          s.querySelectorAll("a[data-rz-wa]").forEach((w) => {
            const satir = [...f.elements].filter((e) => e.name && String(e.value).trim()).map((e) => `${etiket(e)}: ${deger(e)}`);
            const metin = [w.dataset.rzOnek || ""].concat(satir).filter(Boolean).join("\n");
            w.setAttribute("href", `https://wa.me/${w.dataset.rzWa}${metin ? "?text=" + encodeURIComponent(metin) : ""}`);
          });
        };
        f.addEventListener("input", esle);
        f.addEventListener("change", esle);
        esle();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      rzTarih(s, P, az);
    });
  })();
</script>
